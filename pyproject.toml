[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-ledger"
version = "1.0.0"
description = "Loyalty Ledger Intelligence Platform - Synthetic data factory, auditable transaction ledger, and data-quality evaluation platform"
authors = [{ name = "Vishal Voweldas", email = "vishalvoweldas67@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/vishalvoweldas/loyalty-ledger-intelligence-platform"
Repository = "https://github.com/vishalvoweldas/loyalty-ledger-intelligence-platform.git"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
loyalty-ledger = "loyalty_ledger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

