version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loyalty_ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loyalty_ledger
      POSTGRES_USER: loyalty_user
      POSTGRES_PASSWORD: loyalty_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./exports/sql:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    container_name: loyalty_ledger_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://loyalty_user:loyalty_password@postgres:5432/loyalty_ledger
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./reports:/app/reports

volumes:
  postgres_data:
